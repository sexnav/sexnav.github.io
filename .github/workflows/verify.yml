name: Verify mirror release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate production snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s manifest.json
          js="$(find assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          css="$(find assets -maxdepth 1 -type f -name 'index-*.css' -print -quit)"
          test -n "$js"
          test -n "$css"
          node --check "$js"
          grep -Fq "/$js" index.html
          grep -Fq "/$css" index.html
          grep -Fq "connect-src 'self' https:" _headers
          node -e "JSON.parse(require('fs').readFileSync('config.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
