name: Vendor Tabler UI CSS
"on":
  push:
    branches:
      - feat/tabler-publisher-ui
    paths:
      - .github/workflows/vendor-tabler.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor-css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Extract compiled stylesheet from pinned MIT package
        run: |
          set -euo pipefail
          mkdir -p assets/vendor
          workdir="$(mktemp -d)"
          npm pack @tabler/core@1.6.1 --pack-destination "$workdir" --ignore-scripts --silent
          tar -xOf "$workdir/tabler-core-1.6.1.tgz" package/dist/css/tabler.min.css > assets/vendor/tabler.min.css
          test -s assets/vendor/tabler.min.css
          grep -q -- '--tblr-' assets/vendor/tabler.min.css
          printf '%s\n' "Vendor CSS bytes: $(wc -c < assets/vendor/tabler.min.css)"
      - name: Commit vendored stylesheet to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/tabler.min.css
          if ! git diff --cached --quiet; then
            git commit -m "vendor: pin compiled Tabler UI CSS 1.6.1"
            git push origin HEAD:feat/tabler-publisher-ui
          fi
