name: Import upstream source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror pinned upstream commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/aidizhi-source
          git clone https://github.com/aidizhi/aidizhi.github.io.git /tmp/aidizhi-source
          git -C /tmp/aidizhi-source checkout b59addefc9ec396ff36321b1cc10b6a79ab36e77

          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            /tmp/aidizhi-source/ "$GITHUB_WORKSPACE/"

          git config user.name "ntrsp"
          git config user.email "oraclephoe@gmail.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Target already matches the pinned upstream commit."
            exit 0
          fi

          git commit -m "feat: mirror aidizhi permanent access page"
          git push origin HEAD:main
